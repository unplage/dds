<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>打地鼠·纯净木鱼声</title>
	<link rel="manifest" href="./manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        body {
            font-family: 'Arial Rounded MT Bold', 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0a6b4d, #2a9d8f, #e9c46a);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow: hidden;
        }
        
        .container {
            width: 100%;
            max-width: 540px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            backdrop-filter: blur(2px);
        }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 2px;
            color: #FFF3B0;
            text-shadow: 3px 3px 0 #b76e2e;
            letter-spacing: 2px;
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 10px 12px;
            margin-bottom: 8px;
            border: 1px solid rgba(255,215,0,0.3);
        }
        
        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #FFE484;
            line-height: 1;
        }
        
        .stat-label {
            font-size: 0.65rem;
            opacity: 0.9;
        }
        
        .combo-display {
            font-size: 1rem;
            font-weight: bold;
            color: #ffaa66;
            text-shadow: 0 0 4px red;
            margin-top: 4px;
            height: 28px;
            letter-spacing: 1px;
        }
        
        .game-board {
            position: relative;
            width: 92vw;
            height: 92vw;
            max-width: 420px;
            max-height: 420px;
            margin: 6px 0;
            background: radial-gradient(circle at 30% 20%, rgba(76, 48, 25, 0.4), rgba(0,0,0,0.2));
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        
        .circle {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: transparent;
            border: 3px solid rgba(255, 215, 0, 0.7);
            box-shadow: 0 0 15px gold;
            pointer-events: none;
        }
        
        .hole {
            position: absolute;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #8B5A2B, #4E2E1A);
            box-shadow: inset 0 6px 8px rgba(0, 0, 0, 0.8), 0 4px 6px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: transform 0.05s linear;
            z-index: 1;
            overflow: hidden;
            will-change: transform;
        }
        
        .hole:active {
            transform: scale(0.96);
        }
        
        .mole {
            position: absolute;
            width: 90%;
            height: 82%;
            bottom: -100%;
            left: 5%;
            background: #D9A066;
            border-radius: 55% 55% 45% 45%;
            transition: bottom 0.12s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            cursor: pointer;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
            will-change: bottom;
        }
        
        .mole.show {
            bottom: 0;
        }
        
        .mole::before {
            content: "";
            position: absolute;
            top: 20px;
            left: 14px;
            width: 14px;
            height: 14px;
            background: white;
            border-radius: 50%;
            box-shadow: 28px 0 white;
            z-index: 2;
        }
        
        .mole::after {
            content: "";
            position: absolute;
            top: 23px;
            left: 17px;
            width: 7px;
            height: 7px;
            background: #222;
            border-radius: 50%;
            box-shadow: 28px 0 #222;
            z-index: 3;
        }
        
        .blush {
            position: absolute;
            bottom: 12px;
            width: 12px;
            height: 8px;
            background: #FFAAAA;
            border-radius: 50%;
            opacity: 0.7;
            filter: blur(1px);
            pointer-events: none;
        }
        .blush.left { left: 8px; }
        .blush.right { right: 8px; }
        
        .whisker {
            position: absolute;
            bottom: 18px;
            width: 14px;
            height: 2px;
            background: #5C3E1F;
            border-radius: 2px;
            transform: rotate(10deg);
            pointer-events: none;
        }
        .whisker.left1 { left: 0px; transform: rotate(-10deg); }
        .whisker.left2 { left: 2px; bottom: 22px; transform: rotate(-20deg); width: 12px; }
        .whisker.right1 { right: 0px; transform: rotate(10deg); }
        .whisker.right2 { right: 2px; bottom: 22px; transform: rotate(20deg); width: 12px; }
        
        .hit-effect {
            position: absolute;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,220,80,0.9), rgba(255,100,0,0.6));
            pointer-events: none;
            animation: hitPop 0.45s ease-out forwards;
            z-index: 200;
        }
        
        @keyframes hitPop {
            0% { transform: scale(0.3); opacity: 1; }
            100% { transform: scale(1.8); opacity: 0; }
        }
        
        .game-controls {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-top: 6px;
            gap: 15px;
        }
        
        .action-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(135deg, #2b5876, #1e3c5c);
            color: white;
            min-width: 110px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: all 0.1s ease;
        }
        .action-btn:active { transform: scale(0.96); }
        .start-btn { background: linear-gradient(135deg, #11998e, #38ef7d); box-shadow: 0 0 8px #38ef7d; }
        .settings-btn { background: linear-gradient(135deg, #8E2DE2, #4A00E0); }
        
        .difficulty-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 6px 0 4px;
        }
        .difficulty-btn {
            padding: 6px 14px;
            border: none;
            border-radius: 40px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.5);
            color: #ffecb3;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
            font-size: 0.8rem;
        }
        .difficulty-btn.active { background: #FFB347; color: #2c1a00; box-shadow: 0 0 8px orange; }
        .difficulty-btn:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(0.2); }
        
        .instructions {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 24px;
            padding: 8px 12px;
            margin-top: 10px;
            font-size: 0.7rem;
            width: 90%;
        }
        
        .settings-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(12px);
        }
        .settings-content {
            background: linear-gradient(145deg, #1f2b3c, #0f1a2a);
            border-radius: 36px;
            padding: 25px;
            width: 88%;
            max-width: 380px;
            border: 1px solid gold;
        }
        .settings-header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .close-settings { background: none; border: none; font-size: 32px; color: #ffd966; cursor: pointer; }
        .setting-item { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; color: white; }
        .toggle-switch {
            width: 50px; height: 26px; background: #555; border-radius: 30px; display: inline-block;
            position: relative; cursor: pointer; transition: 0.2s;
        }
        .toggle-switch.active { background: #4caf50; }
        .toggle-switch span {
            position: absolute; top: 3px; left: 4px; width: 20px; height: 20px;
            background: white; border-radius: 50%; transition: 0.2s;
        }
        .toggle-switch.active span { left: 26px; }
        .hole-count-control { display: flex; align-items: center; gap: 12px; margin: 12px 0; }
        .layout-buttons { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; margin: 12px 0; }
        .layout-btn, .apply-settings { background: #2c3e66; border: none; padding: 10px; border-radius: 60px; color: white; font-weight: bold; }
        .layout-btn.active { background: #ffb347; color: black; }
        .apply-settings { background: #00b09b; width: 100%; margin-top: 20px; }
        
        .game-over {
            position: fixed;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            inset: 0;
            z-index: 110;
        }
        .game-over h2 { color: gold; font-size: 2.5rem; }
        .final-score { font-size: 3.5rem; font-weight: bold; color: #ffaa33; }
        
        @media (max-width: 480px) {
            .hole { width: 62px; height: 62px; }
            .mole { width: 90%; height: 78%; }
            .mole::before { top: 12px; left: 10px; width: 10px; height: 10px; box-shadow: 18px 0 white; }
            .mole::after { top: 14px; left: 12px; width: 5px; height: 5px; box-shadow: 18px 0 #222; }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="container">
    <h1>🐹 打地鼠 · 纯净木鱼声 🥁</h1>
    <div class="stats">
        <div class="stat-box"><div class="stat-value" id="score">0</div><div class="stat-label">得分</div></div>
        <div class="stat-box" id="timerBox"><div class="stat-value" id="time">60</div><div class="stat-label">剩余秒</div></div>
        <div class="stat-box"><div class="stat-value" id="high-score">0</div><div class="stat-label">最高纪录</div></div>
    </div>
    <div class="combo-display" id="comboDisplay"></div>
    <div class="game-board" id="gameBoard"><div class="circle"></div></div>
    <div class="difficulty-buttons" id="difficultyGroup">
        <button class="difficulty-btn active" data-difficulty="easy">🍃 简单</button>
        <button class="difficulty-btn" data-difficulty="medium">🌙 中等</button>
        <button class="difficulty-btn" data-difficulty="hard">🔥 困难</button>
        <button class="difficulty-btn" data-difficulty="insane">💀 疯狂</button>
    </div>
    <div class="game-controls">
        <button class="action-btn start-btn" id="startBtn">▶ 开始游戏</button>
        <button class="action-btn settings-btn" id="settingsBtn"><i class="fas fa-cog"></i> 设置</button>
    </div>
    <div class="instructions">🥁 每次击中只发出一声木鱼“咚”，连击无额外音效，但震动会加强。设置可开关音效/震动/无尽模式。</div>
</div>

<div class="settings-panel" id="settingsPanel">
    <div class="settings-content">
        <div class="settings-header"><h2>⚙️ 游戏设置</h2><button class="close-settings" id="closeSettings">✖</button></div>
        <div class="setting-item"><span>🔊 音效开关（木鱼声）</span><div class="toggle-switch" id="soundToggle"><span></span></div></div>
        <div class="setting-item"><span>📳 震动反馈</span><div class="toggle-switch" id="vibrateToggle"><span></span></div></div>
        <div class="setting-item"><span>🔄 无尽模式 (无限时间)</span><div class="toggle-switch" id="endlessToggle"><span></span></div></div>
        <div class="settings-group"><h3>🐾 地鼠洞数量</h3><div class="hole-count-control"><input type="range" min="4" max="16" value="8" id="holeCountSlider"><span id="holeCountValue">8</span></div></div>
        <div class="settings-group"><h3>🗺️ 布局风格</h3><div class="layout-buttons"><button class="layout-btn" data-layout="circle">圆形</button><button class="layout-btn" data-layout="concentric">同心圆</button><button class="layout-btn" data-layout="grid">网格</button><button class="layout-btn" data-layout="random">随机</button></div></div>
        <button class="apply-settings" id="applySettings">✨ 应用并重开</button>
    </div>
</div>

<div class="game-over" id="gameOver"><h2>💀 GAME OVER 💀</h2><p>最终得分</p><div class="final-score" id="finalScore">0</div><p id="comboMessage"></p><button class="action-btn" id="restartBtn" style="background:#ff9800;">🔨 再来一局</button></div>

<script>
    // ----------------------------- 游戏配置 ----------------------------------
    const CONFIG = {
        easy: { interval: 1400, visible: 1400, points: 10, time: 60 },
        medium: { interval: 950, visible: 950, points: 15, time: 60 },
        hard: { interval: 650, visible: 650, points: 20, time: 45 },
        insane: { interval: 460, visible: 460, points: 25, time: 30 }
    };
    const ESCAPE_PENALTY = 3;
    const MISS_PENALTY = 5;
    const COMBO_TIMEOUT_MS = 1800;
    
    let soundEnabled = true;
    let vibrateEnabled = true;
    let endlessMode = false;
    
    let score = 0;
    let timeLeft = 60;
    let highScore = localStorage.getItem('moleHighScore') || 0;
    let isPlaying = false;
    let currentDifficulty = 'easy';
    let moleInterval = null;
    let timerInterval = null;
    let activeMoles = [];
    let holeCount = 8;
    let layoutType = 'circle';
    let comboCount = 0;
    let maxCombo = 0;
    let comboTimeoutId = null;
    let moleTimeouts = new Map();
    let pendingSettings = { holeCount: 8, layoutType: 'circle', endless: false, sound: true, vibrate: true };
    let settingsResumeFlag = false;
    let resizeDebounce = null;
    
    // ---------- Web Audio 木鱼音效 (单次敲击) ----------
    let audioCtx = null;
    let audioUnlocked = false;
    
    function initAudioContext() {
        if (audioCtx) return audioCtx;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            return audioCtx;
        } catch(e) { console.warn("Web Audio not supported"); return null; }
    }
    
    // 单次木鱼声（模拟敲击木头）
    function playMuyuSound() {
        if (!soundEnabled) return;
        const ctx = initAudioContext();
        if (!ctx || ctx.state !== 'running') return;
        
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        
        osc.type = 'sine';
        osc.frequency.value = 280;      // 木鱼基频
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
        osc.start();
        osc.stop(now + 0.08);
        
        // 微弱的二次泛音（让声音圆润）
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.type = 'triangle';
        osc2.frequency.value = 560;
        gain2.gain.setValueAtTime(0.08, now);
        gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);
        osc2.start();
        osc2.stop(now + 0.06);
    }
    
    // 空击声音（更低、更短）
    function playMissWoodSound() {
        if (!soundEnabled) return;
        const ctx = initAudioContext();
        if (!ctx || ctx.state !== 'running') return;
        
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.value = 180;
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
        osc.start();
        osc.stop(now + 0.05);
    }
    
    function unlockAudio() {
        if (audioUnlocked) return true;
        const ctx = initAudioContext();
        if (!ctx) return false;
        if (ctx.state === 'suspended') {
            ctx.resume().then(() => {
                audioUnlocked = true;
                // 播放一个静默脉冲彻底激活音频输出
                const buffer = ctx.createBuffer(1, 1, 44100);
                const source = ctx.createBufferSource();
                source.buffer = buffer;
                source.connect(ctx.destination);
                source.start();
            }).catch(e => console.log("AudioContext resume failed", e));
        } else {
            audioUnlocked = true;
        }
        return audioUnlocked;
    }
    
    // 震动（普通）
    function vibrateLight() {
        if (vibrateEnabled && window.navigator && window.navigator.vibrate) {
            window.navigator.vibrate(18);
        }
    }
    
    // 连击时的加强震动（但音效仍只一次）
    function vibrateCombo() {
        if (vibrateEnabled && window.navigator && window.navigator.vibrate) {
            window.navigator.vibrate([18, 30, 18]);
        }
    }
    
    // ---------- 核心音效调用（无叠加）----------
    function playHit() {
        if (soundEnabled) {
            unlockAudio();
            playMuyuSound();   // 只一次木鱼声
        }
        vibrateLight();        // 基础震动
    }
    
    function playMiss() {
        if (soundEnabled) {
            unlockAudio();
            playMissWoodSound();
        }
        vibrateLight();
    }
    
    // 连击时只加强震动，不增加任何额外声音
    function onComboAchieved() {
        if (comboCount >= 3 && comboCount % 3 === 0) {
            vibrateCombo();    // 加强震动反馈
        }
    }
    
    // ---------- 游戏逻辑 (完整保留) ----------
    function updateUI() {
        scoreEl.textContent = Math.floor(score);
        if (!endlessMode) timeEl.textContent = timeLeft;
        else timeEl.textContent = '∞';
        highScoreEl.textContent = highScore;
        if (comboCount > 1) comboDisplay.textContent = `✨ ${comboCount} 连击！ +${comboCount*2}分 ✨`;
        else comboDisplay.textContent = '';
    }
    
    function resetComboTimer() {
        if (comboTimeoutId) clearTimeout(comboTimeoutId);
        comboTimeoutId = setTimeout(() => {
            if (comboCount > 0 && isPlaying) {
                comboCount = 0;
                updateUI();
                if (comboDisplay) comboDisplay.textContent = '💔 连击中断';
                setTimeout(() => { if(comboDisplay && !comboCount) comboDisplay.textContent = ''; }, 600);
            }
        }, COMBO_TIMEOUT_MS);
    }
    
    function breakCombo() {
        if (comboTimeoutId) clearTimeout(comboTimeoutId);
        comboCount = 0;
        updateUI();
        comboDisplay.textContent = '';
    }
    
    function setDifficultyButtonsEnabled(enabled) {
        difficultyBtns.forEach(btn => enabled ? btn.removeAttribute('disabled') : btn.setAttribute('disabled', 'disabled'));
    }
    
    function clearAllMolesAndTimeouts() {
        if (moleTimeouts.size) { for (let [idx, tid] of moleTimeouts.entries()) clearTimeout(tid); moleTimeouts.clear(); }
        document.querySelectorAll('.mole').forEach(m => m.classList.remove('show'));
        activeMoles = [];
    }
    
    function stopGameLoops() {
        if (moleInterval) clearInterval(moleInterval);
        if (timerInterval) clearInterval(timerInterval);
        moleInterval = null;
        timerInterval = null;
    }
    
    function scheduleMoleHide(index, moleEl) {
        if (moleTimeouts.has(index)) clearTimeout(moleTimeouts.get(index));
        const timeoutId = setTimeout(() => {
            if (moleEl && moleEl.classList.contains('show') && isPlaying) {
                moleEl.classList.remove('show');
                activeMoles = activeMoles.filter(i => i !== index);
                score = Math.max(0, score - ESCAPE_PENALTY);
                breakCombo();
                updateUI();
                playMiss();
                const displayDiv = comboDisplay;
                if (displayDiv) {
                    const original = displayDiv.textContent;
                    displayDiv.textContent = `😤 逃脱 -${ESCAPE_PENALTY}`;
                    setTimeout(() => { if (displayDiv && displayDiv.textContent.includes('逃脱')) displayDiv.textContent = original; }, 400);
                }
            }
            moleTimeouts.delete(index);
        }, CONFIG[currentDifficulty].visible);
        moleTimeouts.set(index, timeoutId);
    }
    
    function handleMoleClick(index) {
        if (!isPlaying) return;
        unlockAudio();
        
        const mole = document.querySelector(`.mole[data-index="${index}"]`);
        if (!mole || !mole.classList.contains('show')) {
            score = Math.max(0, score - MISS_PENALTY);
            breakCombo();
            updateUI();
            playMiss();
            const parent = mole ? mole.parentElement : null;
            if(parent) {
                const fx = document.createElement('div');
                fx.className = 'hit-effect';
                fx.style.background = 'radial-gradient(circle, rgba(255,80,80,0.7), rgba(200,0,0,0.5))';
                parent.appendChild(fx);
                setTimeout(()=>fx.remove(), 350);
            }
            return;
        }
        const parentHole = mole.parentElement;
        mole.classList.remove('show');
        activeMoles = activeMoles.filter(i => i !== index);
        if (moleTimeouts.has(index)) { clearTimeout(moleTimeouts.get(index)); moleTimeouts.delete(index); }
        comboCount++;
        if (comboCount > maxCombo) maxCombo = comboCount;
        resetComboTimer();
        const basePoints = CONFIG[currentDifficulty].points;
        const comboBonus = comboCount > 1 ? comboCount * 2 : 0;
        const totalGain = basePoints + comboBonus;
        score += totalGain;
        if (score > highScore) { highScore = score; localStorage.setItem('moleHighScore', highScore); }
        updateUI();
        
        // 播放击中音效 (单次木鱼声)
        playHit();
        
        // 连击时只触发加强震动，不额外播放声音
        if (comboCount >= 3 && comboCount % 3 === 0) {
            onComboAchieved();
        }
        
        const hitEffect = document.createElement('div');
        hitEffect.className = 'hit-effect';
        parentHole.appendChild(hitEffect);
        setTimeout(() => hitEffect.remove(), 450);
        
        const floatText = document.createElement('div');
        floatText.innerText = `+${totalGain}`;
        floatText.style.position = 'absolute';
        floatText.style.left = '20px';
        floatText.style.top = '-15px';
        floatText.style.fontSize = '20px';
        floatText.style.fontWeight = 'bold';
        floatText.style.color = '#FFD966';
        floatText.style.textShadow = '1px 1px 0 black';
        floatText.style.pointerEvents = 'none';
        floatText.style.zIndex = '99';
        floatText.style.animation = 'hitPop 0.4s ease-out forwards';
        parentHole.appendChild(floatText);
        setTimeout(() => floatText.remove(), 500);
    }
    
    function showRandomMole() {
        if (!isPlaying) return;
        const moles = document.querySelectorAll('.mole');
        if (moles.length === 0) return;
        const available = Array.from(moles.keys()).filter(idx => !activeMoles.includes(idx));
        if (available.length === 0) return;
        const randIdx = available[Math.floor(Math.random() * available.length)];
        const mole = moles[randIdx];
        if (mole.classList.contains('show')) return;
        mole.classList.add('show');
        activeMoles.push(randIdx);
        scheduleMoleHide(randIdx, mole);
    }
    
    function createHoles() {
        const existingHoles = document.querySelectorAll('.hole:not(.circle)');
        existingHoles.forEach(h => h.remove());
        const boardRect = gameBoard.getBoundingClientRect();
        const boardWidth = boardRect.width;
        const boardHeight = boardRect.height;
        const centerX = boardWidth / 2;
        const centerY = boardHeight / 2;
        const radius = Math.min(boardWidth, boardHeight) / 2 - 48;
        let positions = [];
        switch(layoutType) {
            case 'circle':
                for (let i=0; i<holeCount; i++) { let ang = (i/holeCount)*2*Math.PI; positions.push({x: centerX+radius*Math.cos(ang)-35, y: centerY+radius*Math.sin(ang)-35}); }
                break;
            case 'concentric':
                let rings = holeCount<=8?2:3; let perRing = Math.ceil(holeCount/rings);
                for(let r=1; r<=rings; r++) { let ringRad = (radius*r)/rings; let holesThis = (r===rings)?holeCount-(perRing*(rings-1)):perRing;
                    for(let i=0;i<holesThis;i++) { let ang = (i/holesThis)*2*Math.PI; positions.push({x: centerX+ringRad*Math.cos(ang)-35, y: centerY+ringRad*Math.sin(ang)-35}); } }
                break;
            case 'grid':
                let cols = Math.ceil(Math.sqrt(holeCount)), rows = Math.ceil(holeCount/cols);
                let cellW = boardWidth/(cols+1), cellH = boardHeight/(rows+1);
                for(let i=0;i<holeCount;i++){ let col=i%cols, row=Math.floor(i/cols); positions.push({x:cellW*(col+1)-35, y:cellH*(row+1)-35}); }
                break;
            default:
                for(let i=0;i<holeCount;i++){ let a=Math.random()*2*Math.PI, rad=Math.random()*(radius-30)+25; positions.push({x:centerX+rad*Math.cos(a)-35, y:centerY+rad*Math.sin(a)-35}); }
        }
        positions.forEach((pos, idx) => {
            const hole = document.createElement('div');
            hole.className = 'hole';
            hole.style.left = `${Math.min(Math.max(pos.x, 5), boardWidth-70)}px`;
            hole.style.top = `${Math.min(Math.max(pos.y, 5), boardHeight-70)}px`;
            hole.dataset.index = idx;
            const mole = document.createElement('div');
            mole.className = 'mole';
            mole.dataset.index = idx;
            const blushL = document.createElement('div'); blushL.className = 'blush left'; 
            const blushR = document.createElement('div'); blushR.className = 'blush right';
            const whiskerL1 = document.createElement('div'); whiskerL1.className = 'whisker left1';
            const whiskerL2 = document.createElement('div'); whiskerL2.className = 'whisker left2';
            const whiskerR1 = document.createElement('div'); whiskerR1.className = 'whisker right1';
            const whiskerR2 = document.createElement('div'); whiskerR2.className = 'whisker right2';
            mole.appendChild(blushL); mole.appendChild(blushR);
            mole.appendChild(whiskerL1); mole.appendChild(whiskerL2);
            mole.appendChild(whiskerR1); mole.appendChild(whiskerR2);
            hole.appendChild(mole);
            gameBoard.appendChild(hole);
            hole.addEventListener('click', (e) => { e.stopPropagation(); handleMoleClick(idx); });
            hole.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); handleMoleClick(idx); }, { passive: false });
        });
    }
    
    function endGame() {
        if (!isPlaying) return;
        isPlaying = false;
        stopGameLoops();
        clearAllMolesAndTimeouts();
        if (comboTimeoutId) clearTimeout(comboTimeoutId);
        setDifficultyButtonsEnabled(true);
        finalScoreEl.textContent = Math.floor(score);
        if(maxCombo>=3) comboMessageSpan.innerHTML = `🏆 最高连击 x${maxCombo} 🏆`;
        else comboMessageSpan.innerHTML = '';
        gameOverScreen.style.display = 'flex';
    }
    
    function startGameLogic(resetTimer = true) {
        if (isPlaying) {
            isPlaying = false;
            stopGameLoops();
            clearAllMolesAndTimeouts();
            if (comboTimeoutId) clearTimeout(comboTimeoutId);
            startBtn.textContent = '▶ 继续游戏';
            setDifficultyButtonsEnabled(true);
        } else {
            isPlaying = true;
            startBtn.textContent = '⏸ 暂停游戏';
            setDifficultyButtonsEnabled(false);
            unlockAudio();
            
            if (resetTimer && timerInterval === null && !endlessMode) {
                timeLeft = CONFIG[currentDifficulty].time;
                timeEl.textContent = timeLeft;
                timerInterval = setInterval(() => {
                    if(!isPlaying) return;
                    if(!endlessMode) {
                        timeLeft--;
                        timeEl.textContent = timeLeft;
                        if(timeLeft <= 0) endGame();
                    }
                }, 1000);
            } else if (endlessMode && timerInterval === null) {
                timerInterval = setInterval(() => { if(!isPlaying) return; updateUI(); }, 500);
            }
            if (moleInterval) clearInterval(moleInterval);
            moleInterval = setInterval(() => showRandomMole(), CONFIG[currentDifficulty].interval);
        }
    }
    
    function initGame(fullReset = true) {
        if (isPlaying) startGameLogic(); 
        isPlaying = false;
        stopGameLoops();
        clearAllMolesAndTimeouts();
        if (comboTimeoutId) clearTimeout(comboTimeoutId);
        score = 0;
        comboCount = 0; maxCombo = 0;
        timeLeft = CONFIG[currentDifficulty].time;
        updateUI();
        gameOverScreen.style.display = 'none';
        createHoles();
        startBtn.textContent = '开始游戏';
        setDifficultyButtonsEnabled(true);
        if (fullReset) highScore = localStorage.getItem('moleHighScore') || 0;
        highScoreEl.textContent = highScore;
        if (endlessMode) timerBox.style.opacity = '0.7';
        else timerBox.style.opacity = '1';
    }
    
    function setDifficulty(level) {
        if (isPlaying) return;
        currentDifficulty = level;
        difficultyBtns.forEach(btn => btn.dataset.difficulty === level ? btn.classList.add('active') : btn.classList.remove('active'));
        timeLeft = CONFIG[level].time;
        timeEl.textContent = endlessMode ? '∞' : timeLeft;
        if (!isPlaying) { score = 0; comboCount=0; updateUI(); }
    }
    
    function openSettings() {
        if (isPlaying) { settingsResumeFlag = true; startGameLogic(); }
        else settingsResumeFlag = false;
        settingsPanel.style.display = 'flex';
    }
    function closeSettingsAndResume() {
        settingsPanel.style.display = 'none';
        if (settingsResumeFlag && !isPlaying) startGameLogic();
        settingsResumeFlag = false;
    }
    
    function applyAndRestart() {
        if (isPlaying) { alert('请先结束或暂停游戏再调整设置'); return; }
        holeCount = pendingSettings.holeCount;
        layoutType = pendingSettings.layoutType;
        endlessMode = pendingSettings.endless;
        soundEnabled = pendingSettings.sound;
        vibrateEnabled = pendingSettings.vibrate;
        soundToggle.classList.toggle('active', soundEnabled);
        vibrateToggle.classList.toggle('active', vibrateEnabled);
        endlessToggle.classList.toggle('active', endlessMode);
        if (endlessMode) timerBox.style.opacity = '0.7';
        else timerBox.style.opacity = '1';
        closeSettingsAndResume();
        initGame(true);
        breakCombo();
    }
    
    // DOM 元素绑定
    const scoreEl = document.getElementById('score');
    const timeEl = document.getElementById('time');
    const highScoreEl = document.getElementById('high-score');
    const startBtn = document.getElementById('startBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const gameOverScreen = document.getElementById('gameOver');
    const finalScoreEl = document.getElementById('finalScore');
    const restartBtn = document.getElementById('restartBtn');
    const difficultyBtns = document.querySelectorAll('.difficulty-btn');
    const gameBoard = document.querySelector('.game-board');
    const settingsPanel = document.getElementById('settingsPanel');
    const closeSettingsBtn = document.getElementById('closeSettings');
    const holeCountSlider = document.getElementById('holeCountSlider');
    const holeCountValue = document.getElementById('holeCountValue');
    const layoutBtns = document.querySelectorAll('.layout-btn');
    const applySettingsBtn = document.getElementById('applySettings');
    const comboDisplay = document.getElementById('comboDisplay');
    const comboMessageSpan = document.getElementById('comboMessage');
    const timerBox = document.getElementById('timerBox');
    const soundToggle = document.getElementById('soundToggle');
    const vibrateToggle = document.getElementById('vibrateToggle');
    const endlessToggle = document.getElementById('endlessToggle');
    
    soundToggle.addEventListener('click', () => { pendingSettings.sound = !pendingSettings.sound; soundToggle.classList.toggle('active', pendingSettings.sound); });
    vibrateToggle.addEventListener('click', () => { pendingSettings.vibrate = !pendingSettings.vibrate; vibrateToggle.classList.toggle('active', pendingSettings.vibrate); });
    endlessToggle.addEventListener('click', () => { pendingSettings.endless = !pendingSettings.endless; endlessToggle.classList.toggle('active', pendingSettings.endless); });
    
    startBtn.addEventListener('click', () => { unlockAudio(); startGameLogic(true); });
    settingsBtn.addEventListener('click', openSettings);
    restartBtn.addEventListener('click', () => { gameOverScreen.style.display = 'none'; initGame(true); startGameLogic(true); });
    closeSettingsBtn.addEventListener('click', closeSettingsAndResume);
    applySettingsBtn.addEventListener('click', applyAndRestart);
    holeCountSlider.addEventListener('input', function(){ holeCountValue.textContent = this.value; pendingSettings.holeCount = parseInt(this.value); });
    layoutBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            layoutBtns.forEach(b=>b.classList.remove('active'));
            this.classList.add('active');
            pendingSettings.layoutType = this.dataset.layout;
        });
    });
    difficultyBtns.forEach(btn => {
        btn.addEventListener('click', () => { if(!isPlaying) setDifficulty(btn.dataset.difficulty); });
    });
    settingsPanel.addEventListener('click', (e) => { if(e.target === settingsPanel) closeSettingsAndResume(); });
    window.addEventListener('resize', () => {
        if (resizeDebounce) clearTimeout(resizeDebounce);
        resizeDebounce = setTimeout(() => { if (!isPlaying) createHoles(); }, 150);
    });
    document.body.addEventListener('touchstart', unlockAudio, { once: true });
    document.body.addEventListener('mousedown', unlockAudio, { once: true });
    
    pendingSettings = { holeCount: 8, layoutType: 'circle', endless: false, sound: true, vibrate: true };
    soundToggle.classList.add('active'); vibrateToggle.classList.add('active'); endlessToggle.classList.remove('active');
    initGame(true);
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      console.log('Service Worker 注册成功，作用域:', reg.scope);
    }).catch(err => {
      console.error('Service Worker 注册失败:', err);
    });
  }
</script>
